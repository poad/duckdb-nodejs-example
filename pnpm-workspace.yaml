packages:
  - .

allowBuilds:
  esbuild: false
  unrs-resolver: false

minimumReleaseAge: 10080 # 7 days in minutes
minimumReleaseAgeExclude:
  - pnpm@12.3.4
  - postcss@8.5.16
  - rolldown@1.1.3
  - brace-expansion@1.1.16 || 5.0.8 || 5.0.9

overrides:
  chokidar: '>=5'
  semver: '>=7'

trustPolicy: no-downgrade
